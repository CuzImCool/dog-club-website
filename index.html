
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOGS Club</title>

<style>
body {
  margin: 0;
  background: #17130f;
  font-family: Arial, sans-serif;
  color: white;
}

#dog-theme {
  box-sizing: border-box;
  min-height: 100vh;
  padding: 24px;
  text-align: center;
  background: #17130f;
  border: 2px solid #66834b;
  border-radius: 14px;
  position: relative;
}

h1 {
  color: #a9c58a;
  font-size: 48px;
  letter-spacing: 5px;
  margin-bottom: 5px;
}

.tagline {
  color: #d6c49b;
  letter-spacing: 3px;
}

.dog-rain {
  position: fixed;
  top: -45px;
  z-index: 999999;
  pointer-events: none;
  animation: dogFall linear forwards;
}

@keyframes dogFall {
  0% {
    transform: translateY(-30px) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

button {
  display: block;
  width: 100%;
  background: linear-gradient(90deg,#496b36,#80613d);
  color: white;
  border: 1px solid #a9c58a;
  border-radius: 9px;
  padding: 14px;
  margin: 20px 0;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.2);
}

a {
  color: #a9c58a;
  text-decoration: none;
  margin: 10px;
}

.section {
  background: #282017;
  border: 1px solid #66834b;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div id="dog-theme">

  <h1>🐶 DOGS 🐶</h1>
  <p class="tagline">PLAY • HAVE FUN • STAY PAWSITIVE</p>

  <button onclick="
    var dogs=['🐶','🐕','🦮','🐩','🐾','🦴','🐕‍🦺'];
    for(var i=0;i<35;i++){
      (function(){
        var dog=document.createElement('span');
        dog.className='dog-rain';
        dog.textContent=dogs[Math.floor(Math.random()*dogs.length)];
        dog.style.left=(Math.random()*96)+'vw';
        dog.style.fontSize=(20+Math.random()*22)+'px';
        dog.style.animationDuration=(2.5+Math.random()*2.5)+'s';
        dog.style.animationDelay=(Math.random()*1.5)+'s';
        document.body.appendChild(dog);
        setTimeout(function(){dog.remove();},7000);
      })();
    }
  ">🐶 MAKE IT RAIN DOGS 🐾</button>

  <div class="section">
    <h2>WELCOME TO THE DOGS CLUB!</h2>
    <p>A place for dog lovers to play, have fun, and enjoy chess!</p>
    <p><a href="https://www.chess.com/club/dog-s" target="_blank">VISIT OUR CHESS.COM CLUB</a></p>
  </div>

  <div class="section">
    <h2>🐾 CLUB NAVIGATION 🐾</h2>
    <p><a href="https://www.chess.com/club/dog-s">HOME</a></p>
    <p><a href="https://www.chess.com/club/dog-s/members">MEMBERS</a></p>
    <p><a href="https://www.chess.com/club/dog-s/events">EVENTS</a></p>
  </div>

  <p style="color:#a9c58a;margin-top:30px;">
    MADE FOR DOG LOVERS 🐶
  </p>

</div>

</body>
</html>
